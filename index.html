<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Судьба ждет...</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0;
            /* Темный мистический фон */
            background: radial-gradient(circle at center, #1a1a2e 0%, #0b0b14 100%);
            height: 100vh;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Cormorant Garamond', serif;
            overflow: hidden;
        }
        .cat-container {
            position: relative;
            width: 90%;
            max-width: 400px;
            display: flex; flex-direction: column; align-items: center;
            text-align: center;
        }
        .cat-image {
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(158, 27, 96, 0.3); /* Свечение Berry */
        }
        .prompt-text {
            color: #D7D3E7; /* Silver */
            font-size: 22px;
            margin-bottom: 20px;
            font-style: italic;
        }
        /* Стили для кнопки на волшебном шаре */
        .magic-button {
            position: absolute;
            bottom: 12%; /* Позиционируем кнопку там, где на картинке шар */
            left: 50%;
            transform: translateX(-50%);
            background-color: #9E1B60; /* Berry */
            color: #D7D3E7; /* Silver */
            padding: 15px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 20px #9E1B60, 0 0 40px #6B0D30;
            animation: pulse 2s infinite;
            transition: all 0.3s ease;
        }
        .magic-button:hover {
            background-color: #6B0D30; /* Royal Burgundy */
            box-shadow: 0 0 30px #9E1B60, 0 0 60px #BD2D62;
        }
        /* Анимация пульсации для кнопки */
        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.05); }
            100% { transform: translateX(-50%) scale(1); }
        }
    </style>
</head>
<body>
    <div class="cat-container">
        <div class="prompt-text">Готовы узнать свою судьбу?</div>
        
        <!-- ВАЖНО: Замените cats.jpg на имя вашего файла с котиками -->
        <img src="cats.jpg" alt="Котики гадают" class="cat-image">
        
        <!-- Кнопка ведет на страницу invitation.html -->
        <a href="invitation.html" class="magic-button">Жми</a>
    </div>
</body>
</html>
